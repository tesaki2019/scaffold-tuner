[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scaffold-tuner"
version = "2.0.3"
description = "Descriptor-directed scaffold-preserving R-group editing tool for drug-like molecules"
requires-python = ">=3.8"
dependencies = [
    "rdkit",
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scaffold_tuner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
